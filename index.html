<!DOCTYPE html>
<html lang="tr" data-theme="summer">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Kişisel Bütçe Takibi</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#1c1917">

  <style>
    /* CSS Temaları */
    :root[data-theme="summer"] {
      --bg: #1c1917;
      --card-bg: rgba(44, 36, 22, 0.75);
      --card-border: rgba(234, 179, 8, 0.25);
      --primary: #eab308;
      --primary-hover: #ca8a04;
      --danger: #ef4444;
      --text: #fef08a;
      --text-muted: #a1a1aa;
      --input-bg: rgba(28, 25, 23, 0.8);
    }

    :root[data-theme="dark"] {
      --bg: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.7);
      --card-border: rgba(255, 255, 255, 0.08);
      --primary: #10b981;
      --primary-hover: #059669;
      --danger: #ef4444;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --input-bg: rgba(15, 23, 42, 0.6);
    }

    :root[data-theme="light"] {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --card-border: rgba(0, 0, 0, 0.1);
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --danger: #dc2626;
      --text: #0f172a;
      --text-muted: #64748b;
      --input-bg: #f1f5f9;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
      transition: background-color 0.3s, color 0.3s, border-color 0.3s;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: clamp(1rem, 4vw, 2rem);
      padding-top: max(1.5rem, env(safe-area-inset-top));
      padding-bottom: max(2rem, env(safe-area-inset-bottom));
      display: flex;
      justify-content: center;
    }

    .app-container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.5rem 0;
    }

    header h1 {
      font-size: 1.4rem;
      font-weight: 700;
    }

    .icon-btn {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text);
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      cursor: pointer;
    }

    /* Sol Yan Ayarlar Menüsü (Drawer) */
    .drawer-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(4px);
      z-index: 99;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }

    .drawer-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .drawer {
      position: fixed;
      top: 0; left: -300px;
      width: 280px;
      height: 100%;
      background: var(--bg);
      border-right: 1px solid var(--card-border);
      z-index: 100;
      padding: 2rem 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      transition: left 0.3s ease;
      box-shadow: 5px 0 25px rgba(0,0,0,0.5);
    }

    .drawer.active {
      left: 0;
    }

    .drawer h2 {
      font-size: 1.3rem;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 0.75rem;
    }

    .setting-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .setting-group label {
      font-size: 0.8rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    /* Zaman Bazlı Harcama Kartları */
    .time-stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
    }

    .time-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 0.85rem;
      border-radius: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .time-card span {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .time-card strong {
      font-size: 1.1rem;
      color: var(--primary);
    }

    /* Bakiye Kartı */
    .balance-card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 1.25rem;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .balance-card .total {
      font-size: 2rem;
      font-weight: 800;
      color: var(--primary);
    }

    /* Form */
    .form-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 1.25rem;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }

    input, select {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--card-border);
      border-radius: 0.75rem;
      padding: 0.85rem 1rem;
      color: var(--text);
      font-size: 1rem;
      outline: none;
    }

    .btn-submit {
      width: 100%;
      background: var(--primary);
      color: #000;
      font-weight: 700;
      padding: 0.9rem;
      border-radius: 0.75rem;
      border: none;
      cursor: pointer;
      font-size: 1rem;
    }

    .about-box {
      font-size: 0.85rem;
      color: var(--text-muted);
      line-height: 1.4;
      background: var(--card-bg);
      padding: 0.85rem;
      border-radius: 0.75rem;
      border: 1px solid var(--card-border);
    }
  </style>
</head>
<body>

  <!-- Sol Ayarlar Menüsü -->
  <div class="drawer-overlay" id="overlay"></div>
  <div class="drawer" id="drawer">
    <h2>⚙️ Ayarlar</h2>

    <div class="setting-group">
      <label>TEMA SEÇİMİ</label>
      <select id="themeSelect">
        <option value="summer">☀️ Yaz Güneşi (Sarı Sıcak)</option>
        <option value="dark">🌙 Karanlık (Dark Mode)</option>
        <option value="light">⚪ Aydınlık (Light Mode)</option>
      </select>
    </div>

    <div class="setting-group">
      <label>HAKKIMDA</label>
      <div class="about-box">
        <b>Sedonar Bütçe v2.0</b><br>
        Kişisel harcamalarını haftalık ve aylık takip etmen için geliştirildi. Veriler Supabase üzerinde güvenle saklanır.
      </div>
    </div>
  </div>

  <div class="app-container">
    <header>
      <button class="icon-btn" id="openSettings">⚙️</button>
      <h1>Bütçe Takibi</h1>
      <div style="width: 42px;"></div>
    </header>

    <!-- Toplam Bakiye -->
    <div class="balance-card">
      <span style="font-size: 0.85rem; color: var(--text-muted);">Toplam Net Bakiye</span>
      <div class="total" id="totalBalance">₺0.00</div>
    </div>

    <!-- Zaman Bazlı Harcama Özetleri -->
    <div class="time-stats-grid">
      <div class="time-card">
        <span>Bu Hafta</span>
        <strong id="thisWeekExpense">₺0.00</strong>
      </div>
      <div class="time-card">
        <span>Geçen Hafta</span>
        <strong id="lastWeekExpense">₺0.00</strong>
      </div>
      <div class="time-card">
        <span>Bu Ay</span>
        <strong id="thisMonthExpense">₺0.00</strong>
      </div>
      <div class="time-card">
        <span>Geçen Ay</span>
        <strong id="lastMonthExpense">₺0.00</strong>
      </div>
    </div>

    <!-- Form -->
    <form class="form-card" id="budgetForm">
      <input type="text" id="descInput" placeholder="Açıklama (Örn: Dondurma, Kahve)" required>
      <input type="number" step="0.01" inputmode="decimal" id="amountInput" placeholder="Tutar (₺)" required>
      <select id="typeInput">
        <option value="expense">Gider (-)</option>
        <option value="income">Gelir (+)</option>
      </select>
      <button type="submit" class="btn-submit">Ekle</button>
    </form>
  </div>

  <script>
    // Drawer Kontrolü
    const openBtn = document.getElementById('openSettings');
    const drawer = document.getElementById('drawer');
    const overlay = document.getElementById('overlay');
    const themeSelect = document.getElementById('themeSelect');

    openBtn.addEventListener('click', () => {
      drawer.classList.add('active');
      overlay.classList.add('active');
    });

    overlay.addEventListener('click', () => {
      drawer.classList.remove('active');
      overlay.classList.remove('active');
    });

    // Tema Değiştirme
    themeSelect.addEventListener('change', (e) => {
      document.documentElement.setAttribute('data-theme', e.target.value);
      localStorage.setItem('selectedTheme', e.target.value);
    });

    // Kayıtlı Temayı Yükleme
    const savedTheme = localStorage.getItem('selectedTheme') || 'summer';
    document.documentElement.setAttribute('data-theme', savedTheme);
    themeSelect.value = savedTheme;
  </script>
</body>
</html>
