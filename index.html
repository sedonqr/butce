<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bütçe Takibim</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: sans-serif; padding: 20px; background: #f4f6f8; max-width: 500px; margin: 0 auto; }
    .card { background: white; padding: 15px; border-radius: 8px; margin-bottom: 10px; }
    input, select, button { width: 100%; padding: 10px; margin-top: 5px; border-radius: 5px; border: 1px solid #ccc; box-sizing: border-box; }
    button { background: #2ecc71; color: white; border: none; font-weight: bold; margin-top: 10px; }
    li { background: white; padding: 10px; margin-bottom: 5px; border-radius: 5px; list-style: none; display: flex; justify-content: space-between; }
  </style>
</head>
<body>
  <h2>Aylık Bütçem</h2>
  <div class="card">
    <input type="text" id="title" placeholder="Harcama Adı (Örn: Market)">
    <input type="number" id="amount" placeholder="Tutar (₺)">
    <select id="type"><option value="expense">Gider</option><option value="income">Gelir</option></select>
    <select id="category">
      <option value="Mutfak">Mutfak</option>
      <option value="Fatura">Fatura</option>
      <option value="Eğlence">Eğlence</option>      <option value="Genel">Genel</option>
    </select>
    <button onclick="ekle()">Ekle</button>
  </div>
  <ul id="liste"></ul>

  <script>
    // BURALARA KENDİ SUPABASE BİLGİLERİNİ YAZ
    const SUPABASE_URL = 'BURAYA_SUPABASE_URL';
    const SUPABASE_KEY = 'BURAYA_SUPABASE_ANON_KEY';
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function yukle() {
      const { data } = await supabase.from('transactions').select('*').order('created_at', { ascending: false });
      const liste = document.getElementById('liste');
      liste.innerHTML = '';
      data.forEach(item => {
        liste.innerHTML += `<li><span>${item.title} (${item.category})</span> <b>${item.type === 'income' ? '+' : '-'}${item.amount} ₺</b></li>`;
      });
    }

    async function ekle() {
      const title = document.getElementById('title').value;
      const amount = document.getElementById('amount').value;
      const type = document.getElementById('type').value;
      const category = document.getElementById('category').value;
      if(!title || !amount) return alert('Boş bırakma!');
      
      await supabase.from('transactions').insert([{ title, amount, type, category }]);
      document.getElementById('title').value = '';
      document.getElementById('amount').value = '';
      yukle();
    }
    yukle();
  </script>
</body>
</html>
