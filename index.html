<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Bütçe Takibi</title>
  
  <!-- iOS PWA & Tam Ekran Meta Etiketleri -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0f172a">

  <style>
    :root {
      --bg: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.7);
      --card-border: rgba(255, 255, 255, 0.08);
      --primary: #10b981;
      --danger: #ef4444;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: clamp(1rem, 4vw, 2rem);
      padding-top: max(1.5rem, env(safe-area-inset-top));
      padding-bottom: max(2rem, env(safe-area-inset-bottom));
      display: flex;
      justify-content: center;
    }

    .app-container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    /* Üst Başlık */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.5rem 0;
    }

    header h1 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    /* Bakiye Özet Kartı */
    .balance-card {
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.15), rgba(15, 23, 42, 0.8));
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 1.25rem;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }

    .balance-card .title {
      font-size: 0.875rem;
      color: var(--text-muted);
    }

    .balance-card .total {
      font-size: 2.25rem;
      font-weight: 800;
      color: #ffffff;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      padding-top: 0.75rem;
      border-top: 1px solid var(--card-border);
    }

    .stat-item {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .stat-item span {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .stat-item strong.income { color: var(--primary); font-size: 1.1rem; }
    .stat-item strong.expense { color: var(--danger); font-size: 1.1rem; }

    /* Form Alanı */
    .form-card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 1.25rem;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .input-group label {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    input, select {
      width: 100%;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--card-border);
      border-radius: 0.75rem;
      padding: 0.85rem 1rem;
      color: var(--text);
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus, select:focus {
      border-color: var(--primary);
    }

    .type-selector {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.5rem;
    }

    .type-btn {
      padding: 0.75rem;
      border-radius: 0.75rem;
      border: 1px solid var(--card-border);
      background: rgba(15, 23, 42, 0.4);
      color: var(--text-muted);
      font-weight: 600;
      cursor: pointer;
      text-align: center;
    }

    .type-btn.active.income {
      background: rgba(16, 185, 129, 0.2);
      border-color: var(--primary);
      color: var(--primary);
    }

    .type-btn.active.expense {
      background: rgba(239, 68, 68, 0.2);
      border-color: var(--danger);
      color: var(--danger);
    }

    .btn-submit {
      width: 100%;
      background: var(--primary);
      color: #000;
      font-weight: 700;
      padding: 1rem;
      border-radius: 0.75rem;
      border: none;
      cursor: pointer;
      font-size: 1rem;
      margin-top: 0.5rem;
      transition: opacity 0.2s;
    }

    .btn-submit:active {
      opacity: 0.8;
    }

    /* İşlem Listesi */
    .transactions-list {
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
    }

    .transaction-item {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 1rem 1.25rem;
      border-radius: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .transaction-info {
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
    }

    .transaction-title {
      font-weight: 600;
      font-size: 0.95rem;
    }

    .transaction-date {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .transaction-amount {
      font-weight: 700;
      font-size: 1rem;
    }

    .transaction-amount.income { color: var(--primary); }
    .transaction-amount.expense { color: var(--danger); }
  </style>
</head>
<body>

  <div class="app-container">
    <header>
      <h1>Bütçe Takibi</h1>
    </header>

    <!-- Bakiye Kartı -->
    <div class="balance-card">
      <div>
        <div class="title">Toplam Bakiye</div>
        <div class="total" id="totalBalance">₺0.00</div>
      </div>
      <div class="stats-grid">
        <div class="stat-item">
          <span>Aylık Gelir</span>
          <strong class="income" id="totalIncome">+₺0.00</strong>
        </div>
        <div class="stat-item">
          <span>Aylık Gider</span>
          <strong class="expense" id="totalExpense">-₺0.00</strong>
        </div>
      </div>
    </div>

    <!-- İşlem Ekleme Formu -->
    <form class="form-card" id="budgetForm">
      <div class="type-selector">
        <div class="type-btn active expense" id="btnExpense">Gider</div>
        <div class="type-btn income" id="btnIncome">Gelir</div>
      </div>

      <div class="input-group">
        <label>AÇIKLAMA</label>
        <input type="text" id="descInput" placeholder="Örn: Market alışverişi" required>
      </div>

      <div class="input-group">
        <label>TUTAR (₺)</label>
        <input type="number" step="0.01" inputmode="decimal" id="amountInput" placeholder="0.00" required>
      </div>

      <button type="submit" class="btn-submit">İşlemi Kaydet</button>
    </form>

    <!-- Son İşlemler Listesi -->
    <div class="transactions-list" id="transactionList">
      <!-- JavaScript ile yüklenecek olan işlemler -->
    </div>
  </div>

</body>
</html>
